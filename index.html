<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1ME RUST | CONFIGS</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .terminal {
            width: 90%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff41;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 1.8em;
            text-shadow: 0 0 10px #00ff41;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .download-btn {
            color: #050505;
            background: #00ff41;
            text-decoration: none;
            padding: 15px;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid #00ff41;
            transition: 0.3s;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 65, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0); }
        }

        .download-btn:hover {
            background: transparent;
            color: #00ff41;
            box-shadow: 0 0 20px #00ff41;
        }

        .tg-link {
            display: block;
            margin-top: 30px;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px dashed #fff;
            padding-bottom: 5px;
            font-size: 16px;
        }

        .tg-link:hover { color: #00ff41; border-color: #00ff41; }

        .info { font-size: 10px; margin-top: 20px; opacity: 0.6; }
    </style>
</head>
<body>

<div class="terminal">
    <h1>[ DOWNLOAD_CENTER ]</h1>
    <p>> Выберите сервер для скачивания:</p>
    
    <div class="config-grid">
        <a href="1.conf" download class="download-btn">ГЕРМАНИЯ .CONF</a>
        <a href="2.conf" download class="download-btn">АВСТРИЯ .CONF</a>
        <a href="3.conf" download class="download-btn">БОЛГАРИЯ .CONF</a>
        <a href="4.conf" download class="download-btn">АРМЕНИЯ .CONF</a>
        <a href="5.conf" download class="download-btn">ГРУЗИЯ .CONF</a>
        <a href="6.conf" download class="download-btn">АВСТРАЛИЯ .CONF</a>
    </div>

    <a href="https://t.me/Pr1meRUst" class="container">ПОДДЕРЖКА: @Pr1meRUst</a>

    <div class="info">
        DATABASE: AMNEZIA_WG | ENCRYPTION: ACTIVE
    </div>
</div>

</body>
</html>
